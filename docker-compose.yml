services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      DB_PATH: /app/data/store_intelligence.db
      POS_PATH: /app/data/pos_transactions.csv
      LAYOUT_PATH: /app/data/store_layout.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
